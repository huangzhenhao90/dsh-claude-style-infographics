<svg xmlns="http://www.w3.org/2000/svg" class="ig-flow-loop-right" viewBox="0 0 680 173" width="680" height="173" role="img" aria-label="Agent loop"><title>Agent loop</title><style>.ig-flow-loop-right{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}.ig-flow-loop-right .ig-t1{fill:var(--ig-text1)}.ig-flow-loop-right .ig-t2{fill:var(--ig-text2)}.ig-flow-loop-right .ig-t3{fill:var(--ig-text3)}.ig-flow-loop-right .ig-title-r{fill:var(--ig-title)}.ig-flow-loop-right .ig-sub-r{fill:var(--ig-sub)}.ig-flow-loop-right .ig-box{fill:var(--ig-fill);stroke:var(--ig-stroke);stroke-width:.5}.ig-flow-loop-right .ig-mark{fill:var(--ig-mark)}.ig-flow-loop-right .ig-mark-stroke{stroke:var(--ig-mark);fill:none}.ig-flow-loop-right .ig-mark-area{fill:var(--ig-mark);fill-opacity:.12;stroke:none}.ig-flow-loop-right .ig-surface{fill:var(--ig-surface);stroke:var(--ig-stroke);stroke-width:.5}.ig-flow-loop-right .ig-card{fill:var(--ig-card)}.ig-flow-loop-right .ig-card-r{fill:var(--ig-fill)}.ig-flow-loop-right .ig-grid{stroke:var(--ig-grid);stroke-width:.5}.ig-flow-loop-right .ig-axis{stroke:var(--ig-axis);stroke-width:.5}.ig-flow-loop-right .ig-edge{stroke:var(--ig-edge);stroke-width:.75;fill:none}.ig-flow-loop-right .ig-arrowhead{stroke:var(--ig-edge);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ig-flow-loop-right .ig-dash{stroke-dasharray:4 3}.ig-flow-loop-right .ig-pos{fill:#3B6D11}.ig-flow-loop-right .ig-neg{fill:#A32D2D}.ig-flow-loop-right .ig-line{stroke:var(--ig-stroke);stroke-width:.75}.ig-flow-loop-right{--ig-text1:#E8E6DF;--ig-text2:#B4B2A9;--ig-text3:#888780;--ig-grid:rgba(255,255,255,0.09);--ig-edge:#B4B2A9;--ig-axis:#5F5E5A;--ig-surface:#262624;--ig-card:#2C2C2A}.ig-flow-loop-right .ig-r-purple{--ig-fill:#3C3489;--ig-stroke:#AFA9EC;--ig-title:#CECBF6;--ig-sub:#AFA9EC;--ig-mark:#7F77DD}.ig-flow-loop-right .ig-r-teal{--ig-fill:#085041;--ig-stroke:#5DCAA5;--ig-title:#9FE1CB;--ig-sub:#5DCAA5;--ig-m