<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="ig-timeline-release" viewBox="0 0 680 305" width="680" height="305" role="img" aria-label="产品发布节奏"><title>产品发布节奏</title><style>.ig-timeline-release{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}.ig-timeline-release .ig-t1{fill:var(--ig-text1)}.ig-timeline-release .ig-t2{fill:var(--ig-text2)}.ig-timeline-release .ig-t3{fill:var(--ig-text3)}.ig-timeline-release .ig-title-r{fill:var(--ig-title)}.ig-timeline-release .ig-sub-r{fill:var(--ig-sub)}.ig-timeline-release .ig-box{fill:var(--ig-fill);stroke:var(--ig-stroke);stroke-width:.5}.ig-timeline-release .ig-mark{fill:var(--ig-mark)}.ig-timeline-release .ig-mark-stroke{stroke:var(--ig-mark);fill:none}.ig-timeline-release .ig-mark-area{fill:var(--ig-mark);fill-opacity:.12;stroke:none}.ig-timeline-release .ig-surface{fill:var(--ig-surface);stroke:var(--ig-stroke);stroke-width:.5}.ig-timeline-release .ig-card{fill:var(--ig-card)}.ig-timeline-release .ig-card-r{fill:var(--ig-fill)}.ig-timeline-release .ig-grid{stroke:var(--ig-grid);stroke-width:.5}.ig-timeline-release .ig-axis{stroke:var(--ig-axis);stroke-width:.5}.ig-timeline-release .ig-edge{stroke:var(--ig-edge);stroke-width:.75;fill:none}.ig-timeline-release .ig-arrowhead{stroke:var(--ig-edge);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ig-timeline-release .ig-dash{stroke-dasharray:4 3}.ig-timeline-release .ig-pos{fill:#3B6D11}.ig-timeline-release .ig-neg{fill:#A32D2D}.ig-timeline-release .ig-line{stroke:var(--ig-stroke);stroke-width:.75}.ig-timeline-release{--ig-text1:#2C2C2A;--ig-text2:#5F5E5A;--ig-text3:#888780;--ig-grid:rgba(0,0,0,0.08);--ig-edge:#888780;--ig-axis:#B4B2A9;--ig-surface:#FFFFFF;--ig-card:#F1EFE8}.ig-timeline-release .ig-r-purple{--ig-fill:#EEEDFE;--ig-stroke:#534AB7;--ig-title:#3C3489;--ig-sub:#534AB7;--ig-mark:#7F77DD}.ig-timeline-release .ig-r-teal{--ig-fill:#E1F5EE;--ig-stroke:#0F6E56;--ig-title:#085041;--ig-sub:#0F6E56;--ig-mark:#1D9E75}.ig-timeline-release .ig-r-coral{--ig-fill:#FAECE7;--ig-stroke:#993C1D;--ig-title:#712B13;--ig-sub:#993C1D;--ig-mark:#D85A30}.ig-timeline-release .ig-r-pink{--ig-fill:#FBEAF0;--ig-stroke:#993556;--ig-title:#72243E;--ig-sub:#993556;--ig-mark:#D4537E}.ig-timeline-release .ig-r-gray{--ig-fill:#F1EFE8;--ig-stroke:#5F5E5A;--ig-title:#444441;--ig-sub:#5F5E5A;--ig-mark:#888780}.ig-timeline-release .ig-r-blue{--ig-fill:#E6F1FB;--ig-stroke:#185FA5;--ig-title:#0C447C;--ig-sub:#185FA5;--ig-mark:#378ADD}.ig-timeline-release .ig-r-green{--ig-fill:#EAF3DE;--ig-stroke:#3B6D11;--ig-title:#27500A;--ig-sub:#3B6D11;--ig-mark:#639922}.ig-timeline-release .ig-r-amber{--ig-fill:#FAEEDA;--ig-stroke:#854F0B;--ig-title:#633806;--ig-sub:#854F0B;--ig-mark:#BA7517}.ig-timeline-release .ig-r-red{--ig-fill:#FCEBEB;--ig-stroke:#A32D2D;--ig-title:#791F1F;--ig-sub:#A32D2D;--ig-mark:#E24B4A}</style><text class="ig-t1" x="40" y="34" dominant-baseline="central" font-size="16" font-weight="500">产品发布节奏</text><line class="ig-axis" x1="92" y1="68" x2="92" y2="254"/><g class="ig-r-purple"><title>内部灰度</title><circle class="ig-mark" cx="92" cy="68" r="5"/></g><text class="ig-t2" x="70" y="68" text-anchor="end" dominant-baseline="central" font-size="12">9 月</text><text class="ig-t1" x="114" y="68" dominant-baseline="central" font-size="14" font-weight="500">内部灰度</text><text class="ig-t2" x="114" y="89" dominant-baseline="central" font-size="12">20 名种子用户，重点验证核心流程是否跑得通</text><g class="ig-r-teal"><title>公开测试</title><circle class="ig-mark" cx="92" cy="130" r="5"/></g><text class="ig-t2" x="70" y="130" text-anchor="end" dominant-baseline="central" font-size="12">10 月</text><text class="ig-t1" x="114" y="130" dominant-baseline="central" font-size="14" font-weight="500">公开测试</text><text class="ig-t2" x="114" y="151" dominant-baseline="central" font-size="12">开放排队注册，收集反馈并修复前 30 个高频问题</text><g class="ig-r-coral"><title>正式发布</title><circle class="ig-mark" cx="92" cy="192" r="5"/></g><text class="ig-t2" x="70" y="192" text-anchor="end" dominant-baseline="central" font-size="12">11 月</text><text class="ig-t1" x="114" y="192" dominant-baseline="central" font-size="14" font-weight="500">正式发布</text><text class="ig-t2" x="114" y="213" dominant-baseline="central" font-size="12">上线付费版本和团队协作功能</text><g class="ig-r-blue"><title>开放 API</title><circle class="ig-mark" cx="92" cy="254" r="5"/></g><text class="ig-t2" x="70" y="254" text-anchor="end" dominant-baseline="central" font-size="12">12 月</text><text class="ig-t1" x="114" y="254" dominant-baseline="central" font-size="14" font-weight="500">开放 API</text></svg>