<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="ig-flow-request" viewBox="0 0 680 596" width="680" height="596" role="img" aria-label="一次 API 请求的处理流程"><title>一次 API 请求的处理流程</title><style>.ig-flow-request{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}.ig-flow-request .ig-t1{fill:var(--ig-text1)}.ig-flow-request .ig-t2{fill:var(--ig-text2)}.ig-flow-request .ig-t3{fill:var(--ig-text3)}.ig-flow-request .ig-title-r{fill:var(--ig-title)}.ig-flow-request .ig-sub-r{fill:var(--ig-sub)}.ig-flow-request .ig-box{fill:var(--ig-fill);stroke:var(--ig-stroke);stroke-width:.5}.ig-flow-request .ig-mark{fill:var(--ig-mark)}.ig-flow-request .ig-mark-stroke{stroke:var(--ig-mark);fill:none}.ig-flow-request .ig-mark-area{fill:var(--ig-mark);fill-opacity:.12;stroke:none}.ig-flow-request .ig-surface{fill:var(--ig-surface);stroke:var(--ig-stroke);stroke-width:.5}.ig-flow-request .ig-card{fill:var(--ig-card)}.ig-flow-request .ig-card-r{fill:var(--ig-fill)}.ig-flow-request .ig-grid{stroke:var(--ig-grid);stroke-width:.5}.ig-flow-request .ig-axis{stroke:var(--ig-axis);stroke-width:.5}.ig-flow-request .ig-edge{stroke:var(--ig-edge);stroke-width:.75;fill:none}.ig-flow-request .ig-arrowhead{stroke:var(--ig-edge);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ig-flow-request .ig-dash{stroke-dasharray:4 3}.ig-flow-request .ig-pos{fill:#3B6D11}.ig-flow-request .ig-neg{fill:#A32D2D}.ig-flow-request .ig-line{stroke:var(--ig-stroke);stroke-width:.75}.ig-flow-request{--ig-text1:#2C2C2A;--ig-text2:#5F5E5A;--ig-text3:#888780;--ig-grid:rgba(0,0,0,0.08);--ig-edge:#888780;--ig-axis:#B4B2A9;--ig-surface:#FFFFFF;--ig-card:#F1EFE8}.ig-flow-request .ig-r-purple{--ig-fill:#EEEDFE;--ig-stroke:#534AB7;--ig-title:#3C3489;--ig-sub:#534AB7;--ig-mark:#7F77DD}.ig-flow-request .ig-r-teal{--ig-fill:#E1F5EE;--ig-stroke:#0F6E56;--ig-title:#085041;--ig-sub:#0F6E56;--ig-mark:#1D9E75}.ig-flow-request .ig-r-coral{--ig-fill:#FAECE7;--ig-stroke:#993C1D;--ig-title:#712B13;--ig-sub:#993C1D;--ig-mark:#D85A30}.ig-flow-request .ig-r-pink{--ig-fill:#FBEAF0;--ig-stroke:#993556;--ig-title:#72243E;--ig-sub:#993556;--ig-mark:#D4537E}.ig-flow-request .ig-r-gray{--ig-fill:#F1EFE8;--ig-stroke:#5F5E5A;--ig-title:#444441;--ig-sub:#5F5E5A;--ig-mark:#888780}.ig-flow-request .ig-r-blue{--ig-fill:#E6F1FB;--ig-stroke:#185FA5;--ig-title:#0C447C;--ig-sub:#185FA5;--ig-mark:#378ADD}.ig-flow-request .ig-r-green{--ig-fill:#EAF3DE;--ig-stroke:#3B6D11;--ig-title:#27500A;--ig-sub:#3B6D11;--ig-mark:#639922}.ig-flow-request .ig-r-amber{--ig-fill:#FAEEDA;--ig-stroke:#854F0B;--ig-title:#633806;--ig-sub:#854F0B;--ig-mark:#BA7517}.ig-flow-request .ig-r-red{--ig-fill:#FCEBEB;--ig-stroke:#A32D2D;--ig-title:#791F1F;--ig-sub:#A32D2D;--ig-mark:#E24B4A}</style><defs><marker id="ig-flow-request-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ig-arrowhead" d="M2 1.5L8 5L2 8.5"/></marker></defs><text class="ig-t1" x="40" y="34" dominant-baseline="central" font-size="16" font-weight="500">一次 API 请求的处理流程</text><text class="ig-t2" x="40" y="56" dominant-baseline="central" font-size="13">校验失败直接返回，成功才进入业务逻辑</text><g transform="translate(219.7 82)"><path class="ig-edge" d="M127.3 60L127.3 106" marker-end="url(#ig-flow-request-arrow)"/><path class="ig-edge" d="M127.3 166L127.3 212" marker-end="url(#ig-flow-request-arrow)"/><path class="ig-edge" d="M58.9 242L59.3 242Q59.7 242 59.7 242.4L59.7 328" marker-end="url(#ig-flow-request-arrow)"/><text class="ig-t2" x="67.7" y="285" dominant-baseline="central" font-size="11">是</text><path class="ig-edge" d="M195.8 242L195.4 242Q195 242 195 242.4L195 328" marker-end="url(#ig-flow-request-arrow)"/><text class="ig-t2" x="203" y="285" dominant-baseline="central" font-size="11">否</text><path class="ig-edge" d="M59.7 388L59.7 408Q59.7 416 67.7 416L119.3 416Q127.3 416 127.3 424L127.3 444" marker-end="url(#ig-flow-request-arrow)"/><path class="ig-edge" d="M195 388L195 408Q195 416 187 416L135.3 416Q127.3 416 127.3 424L127.3 444" marker-end="url(#ig-flow-request-arrow)"/><g class="ig-r-purple"><title>用户提交请求 — API 或网页表单</title><rect class="ig-box" x="63.7" y="0" width="127.4" height="60" rx="30"/><text class="ig-title-r" x="127.3" y="21" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">用户提交请求</text><text class="ig-sub-r" x="127.3" y="40" text-anchor="middle" dominant-baseline="central" font-size="12">API 或网页表单</text></g><g class="ig-r-teal"><title>身份认证 — 校验令牌与权限</title><rect class="ig-box" x="69.3" y="106" width="116" height="60" rx="8"/><text class="ig-title-r" x="127.3" y="127" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">身份认证</text><text class="ig-sub-r" x="127.3" y="146" text-anchor="middle" dominant-baseline="central" font-size="12">校验令牌与权限</text></g><g class="ig-r-amber"><title>输入合法？</title><polygon class="ig-box" points="127.3,212 195.8,242 127.3,272 58.9,242" stroke-linejoin="round"/><text class="ig-title-r" x="127.3" y="242" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">输入合法？</text></g><g class="ig-r-teal"><title>执行业务逻辑 — 读写数据库</title><rect class="ig-box" x="0" y="328" width="119.4" height="60" rx="8"/><text class="ig-title-r" x="59.7" y="349" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">执行业务逻辑</text><text class="ig-sub-r" x="59.7" y="368" text-anchor="middle" dominant-baseline="central" font-size="12">读写数据库</text></g><g class="ig-r-red"><title>返回错误 — 400 + 原因</title><rect class="ig-box" x="149.4" y="328" width="91.3" height="60" rx="8"/><text class="ig-title-r" x="195" y="349" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">返回错误</text><text class="ig-sub-r" x="195" y="368" text-anchor="middle" dominant-baseline="central" font-size="12">400 + 原因</text></g><g class="ig-r-green"><title>返回结果</title><rect class="ig-box" x="78.2" y="444" width="98.2" height="42" rx="21"/><text class="ig-title-r" x="127.3" y="465" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">返回结果</text></g></g></svg>