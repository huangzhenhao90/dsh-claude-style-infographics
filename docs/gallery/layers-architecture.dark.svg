<svg xmlns="http://www.w3.org/2000/svg" class="ig-layers-architecture" viewBox="0 0 680 452" width="680" height="452" role="img" aria-label="RAG 应用的分层架构"><title>RAG 应用的分层架构</title><style>.ig-layers-architecture{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}.ig-layers-architecture .ig-t1{fill:var(--ig-text1)}.ig-layers-architecture .ig-t2{fill:var(--ig-text2)}.ig-layers-architecture .ig-t3{fill:var(--ig-text3)}.ig-layers-architecture .ig-title-r{fill:var(--ig-title)}.ig-layers-architecture .ig-sub-r{fill:var(--ig-sub)}.ig-layers-architecture .ig-box{fill:var(--ig-fill);stroke:var(--ig-stroke);stroke-width:.5}.ig-layers-architecture .ig-mark{fill:var(--ig-mark)}.ig-layers-architecture .ig-mark-stroke{stroke:var(--ig-mark);fill:none}.ig-layers-architecture .ig-mark-area{fill:var(--ig-mark);fill-opacity:.12;stroke:none}.ig-layers-architecture .ig-surface{fill:var(--ig-surface);stroke:var(--ig-stroke);stroke-width:.5}.ig-layers-architecture .ig-card{fill:var(--ig-card)}.ig-layers-architecture .ig-card-r{fill:var(--ig-fill)}.ig-layers-architecture .ig-grid{stroke:var(--ig-grid);stroke-width:.5}.ig-layers-architecture .ig-axis{stroke:var(--ig-axis);stroke-width:.5}.ig-layers-architecture .ig-edge{stroke:var(--ig-edge);stroke-width:.75;fill:none}.ig-layers-architecture .ig-arrowhead{stroke:var(--ig-edge);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ig-layers-architecture .ig-dash{stroke-dasharray:4 3}.ig-layers-architecture .ig-pos{fill:#3B6D11}.ig-layers-architecture .ig-neg{fill:#A32D2D}.ig-layers-architecture .ig-line{stroke:var(--ig-stroke);stroke-width:.75}.ig-layers-architecture{--ig-text1:#E8E6DF;--ig-text2:#B4B2A9;--ig-text3:#888780;--ig-grid:rgba(255,255,255,0.09);--ig-edge:#B4B2A9;--ig-axis:#5F5E5A;--ig-surface:#262624;--ig-card:#2C2C2A}.ig-layers-architecture .ig-r-purple{--ig-fill:#3C3489;--ig-stroke:#AFA9EC;--ig-title:#CECBF6;--ig-sub:#AFA9EC;--ig-mark:#7F77DD}.ig-layers-ar