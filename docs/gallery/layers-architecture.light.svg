<svg xmlns="http://www.w3.org/2000/svg" class="ig-layers-architecture" viewBox="0 0 680 452" width="680" height="452" role="img" aria-label="RAG 应用的分层架构"><title>RAG 应用的分层架构</title><style>.ig-layers-architecture{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}.ig-layers-architecture .ig-t1{fill:var(--ig-text1)}.ig-layers-architecture .ig-t2{fill:var(--ig-text2)}.ig-layers-architecture .ig-t3{fill:var(--ig-text3)}.ig-layers-architecture .ig-title-r{fill:var(--ig-title)}.ig-layers-architecture .ig-sub-r{fill:var(--ig-sub)}.ig-layers-architecture .ig-box{fill:var(--ig-fill);stroke:var(--ig-stroke);stroke-width:.5}.ig-layers-architecture .ig-mark{fill:var(--ig-mark)}.ig-layers-architecture .ig-mark-stroke{stroke:var(--ig-mark);fill:none}.ig-layers-architecture .ig-mark-area{fill:var(--ig-mark);fill-opacity:.12;stroke:none}.ig-layers-architecture .ig-surface{fill:var(--ig-surface);stroke:var(--ig-stroke);stroke-width:.5}.ig-layers-architecture .ig-card{fill:var(--ig-card)}.ig-layers-architecture .ig-card-r{fill:var(--ig-fill)}.ig-layers-architecture .ig-grid{stroke:var(--ig-grid);stroke-width:.5}.ig-layers-architecture .ig-axis{stroke:var(--ig-axis);stroke-width:.5}.ig-layers-architecture .ig-edge{stroke:var(--ig-edge);stroke-width:.75;fill:none}.ig-layers-architecture .ig-arrowhead{stroke:var(--ig-edge);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ig-layers-architecture .ig-dash{stroke-dasharray:4 3}.ig-layers-architecture .ig-pos{fill:#3B6D11}.ig-layers-architecture .ig-neg{fill:#A32D2D}.ig-layers-architecture .ig-line{stroke:var(--ig-stroke);stroke-width:.75}.ig-layers-architecture{--ig-text1:#2C2C2A;--ig-text2:#5F5E5A;--ig-text3:#888780;--ig-grid:rgba(0,0,0,0.08);--ig-edge:#888780;--ig-axis:#B4B2A9;--ig-surface:#FFFFFF;--ig-card:#F1EFE8}.ig-layers-architecture .ig-r-purple{--ig-fill:#EEEDFE;--ig-stroke:#534AB7;--ig-title:#3C3489;--ig-sub:#534AB7;--ig-mark:#7F77DD}.ig-layers-architecture .ig-r-teal{--ig-fill:#E1F5EE;--ig-stroke:#0F6E56;--ig-title:#085041;--ig-sub:#0F6E56;--ig-mark:#1D9E75}.ig-layers-architecture .ig-r-coral{--ig-fill:#FAECE7;--ig-stroke:#993C1D;--ig-title:#712B13;--ig-sub:#993C1D;--ig-mark:#D85A30}.ig-layers-architecture .ig-r-pink{--ig-fill:#FBEAF0;--ig-stroke:#993556;--ig-title:#72243E;--ig-sub:#993556;--ig-mark:#D4537E}.ig-layers-architecture .ig-r-gray{--ig-fill:#F1EFE8;--ig-stroke:#5F5E5A;--ig-title:#444441;--ig-sub:#5F5E5A;--ig-mark:#888780}.ig-layers-architecture .ig-r-blue{--ig-fill:#E6F1FB;--ig-stroke:#185FA5;--ig-title:#0C447C;--ig-sub:#185FA5;--ig-mark:#378ADD}.ig-layers-architecture .ig-r-green{--ig-fill:#EAF3DE;--ig-stroke:#3B6D11;--ig-title:#27500A;--ig-sub:#3B6D11;--ig-mark:#639922}.ig-layers-architecture .ig-r-amber{--ig-fill:#FAEEDA;--ig-stroke:#854F0B;--ig-title:#633806;--ig-sub:#854F0B;--ig-mark:#BA7517}.ig-layers-architecture .ig-r-red{--ig-fill:#FCEBEB;--ig-stroke:#A32D2D;--ig-title:#791F1F;--ig-sub:#A32D2D;--ig-mark:#E24B4A}</style><defs><marker id="ig-layers-architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ig-arrowhead" d="M2 1.5L8 5L2 8.5"/></marker></defs><text class="ig-t1" x="40" y="34" dominant-baseline="central" font-size="16" font-weight="500">RAG 应用的分层架构</text><g class="ig-r-purple"><title>接入层</title><rect class="ig-box" x="40" y="58" width="600" height="105" rx="10"/><text class="ig-sub-r" x="54" y="78" dominant-baseline="central" font-size="12" font-weight="500">接入层</text><rect class="ig-surface" x="54" y="98" width="281" height="53" rx="6"/><text class="ig-title-r" x="194.5" y="116" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500">Web 前端</text><text class="ig-sub-r" x="194.5" y="134" text-anchor="middle" dominant-baseline="central" font-size="11">聊天界面</text><rect class="ig-surface" x="345" y="98" width="281" height="53" rx="6"/><text class="ig-title-r"