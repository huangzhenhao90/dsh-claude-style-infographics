<svg xmlns="http://www.w3.org/2000/svg" class="ig-cards-kpi" viewBox="0 0 680 190" width="680" height="190" role="img" aria-label="本周核心指标"><title>本周核心指标</title><style>.ig-cards-kpi{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}.ig-cards-kpi .ig-t1{fill:var(--ig-text1)}.ig-cards-kpi .ig-t2{fill:var(--ig-text2)}.ig-cards-kpi .ig-t3{fill:var(--ig-text3)}.ig-cards-kpi .ig-title-r{fill:var(--ig-title)}.ig-cards-kpi .ig-sub-r{fill:var(--ig-sub)}.ig-cards-kpi .ig-box{fill:var(--ig-fill);stroke:var(--ig-stroke);stroke-width:.5}.ig-cards-kpi .ig-mark{fill:var(--ig-mark)}.ig-cards-kpi .ig-mark-stroke{stroke:var(--ig-mark);fill:none}.ig-cards-kpi .ig-mark-area{fill:var(--ig-mark);fill-opacity:.12;stroke:none}.ig-cards-kpi .ig-surface{fill:var(--ig-surface);stroke:var(--ig-stroke);stroke-width:.5}.ig-cards-kpi .ig-card{fill:var(--ig-card)}.ig-cards-kpi .ig-card-r{fill:var(--ig-fill)}.ig-cards-kpi .ig-grid{stroke:var(--ig-grid);stroke-width:.5}.ig-cards-kpi .ig-axis{stroke:var(--ig-axis);stroke-width:.5}.ig-cards-kpi .ig-edge{stroke:var(--ig-edge);stroke-width:.75;fill:none}.ig-cards-kpi .ig-arrowhead{stroke:var(--ig-edge);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ig-cards-kpi .ig-dash{stroke-dasharray:4 3}.ig-cards-kpi .ig-pos{fill:#3B6D11}.ig-cards-kpi .ig-neg{fill:#A32D2D}.ig-cards-kpi .ig-line{stroke:var(--ig-stroke);stroke-width:.75}.ig-cards-kpi{--ig-text1:#2C2C2A;--ig-text2:#5F5E5A;--ig-text3:#888780;--ig-grid:rgba(0,0,0,0.08);--ig-edge:#888780;--ig-axis:#B4B2A9;--ig-surface:#FFFFFF;--ig-card:#F1EFE8}.ig-cards-kpi .ig-r-purple{--ig-fill:#EEEDFE;--ig-stroke:#534AB7;--ig-title:#3C3489;--ig-sub:#534AB7;--ig-mark:#7F77DD}.ig-cards-kpi .ig-r-teal{--ig-fill:#E1F5EE;--ig-stroke:#0F6E56;--ig-title:#085041;--ig-sub:#0F6E56;--ig-mark:#1D9E75}.ig-cards-kpi .ig-r-coral{--ig-fill:#FAECE7;--ig-stroke:#993C1D;--ig-title:#712B13;--ig-sub:#993C1D;--ig-mark:#D85A30}.ig-cards-kpi .ig-r-pink{--ig-fill